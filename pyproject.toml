[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfunda"
version = "2.6.0"
description = "Free, open-source PDF property reports for Dutch homes."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "phread9" }
]
keywords = ["funda", "real-estate", "netherlands", "housing", "property", "valuation", "report", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "curl-cffi>=0.14.0",
    "tls-client>=1.0.1",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
report = [
    "jinja2>=3.1.6",
    "weasyprint>=68.1",
]

[project.urls]
Homepage = "https://github.com/phread9/pinkman-report"
Repository = "https://github.com/phread9/pinkman-report"
Issues = "https://github.com/phread9/pinkman-report/issues"

[tool.hatch.build.targets.wheel]
packages = ["funda"]
